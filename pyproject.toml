[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall"
version = "0.1.0"
description = "Alerting over KDB, Bloomberg and in-house scripts: Huginn, Muninn, Sleipnir and Bifrost."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "croniter>=2.0",
    "streamlit>=1.45",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
kdb = ["pykx>=2.5"]
# Bloomberg B-PIPE. blpapi comes from Bloomberg's own package index:
#   pip install -e ".[bloomberg]" --extra-index-url https://blpapi.bloomberg.com/repository/releases/python/simple/
bloomberg = ["blpapi>=3.19"]
dev = ["pytest>=8"]

[project.scripts]
heimdall = "heimdall.__main__:main"

[tool.setuptools.packages.find]
include = ["heimdall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: starts the real processes (about a minute); deselect with -m \"not e2e\""]

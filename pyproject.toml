[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall"
version = "0.1.0"
description = "Alerting over KDB, Bloomberg and in-house scripts: Huginn, Muninn, Sleipnir and Bifrost."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "croniter>=2.0",
    "requests>=2.31",
    "streamlit>=1.45",
]

[project.optional-dependencies]
kdb = ["pykx>=2.5"]
# BbgRelay's client is installed from its own checkout:
#   pip install -e <path-to>/BbgRelay
dev = ["pytest>=8"]

[project.scripts]
heimdall = "heimdall.__main__:main"

[tool.setuptools.packages.find]
include = ["heimdall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
